<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Notary run review — live</title>
<style>
 :root{--fg:#16181d;--mut:#6b7280;--line:#e5e7eb;--card:#fff;--bg:#f7f7f8;--acc:#0b57d0}
 *{box-sizing:border-box}
 body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:22px;line-height:1.5}
 h1{font-size:21px;margin:0 0 2px} .sub{color:var(--mut);font-size:13px;margin:0 0 6px}
 .runs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
 .runbtn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:13px;text-align:left}
 .runbtn small{display:block;color:var(--mut)}
 .runbtn.on{border-color:var(--acc);background:#e8f0fe;box-shadow:0 0 0 1px var(--acc)}
 .flow{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0 4px;background:#fff}
 .seg{padding:8px;color:#fff;font-size:12px;line-height:1.3}
 .seg b{display:block}.seg span{opacity:.88}
 .s-ext{background:#b06000}.s-ver{background:#0b57d0}.s-fin{background:#188038}
 .flabel{display:flex;gap:14px;font-size:12px;color:var(--mut);flex-wrap:wrap;margin-bottom:6px}
 .flabel i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
 .verdict{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
 @media(max-width:820px){.verdict{grid-template-columns:1fr}}
 .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
 .card h2{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
 .found{font-size:14px;font-weight:600;margin:2px 0}
 .pill{display:inline-block;border-radius:20px;padding:1px 10px;font-size:12px;color:#fff;margin:2px 0 6px}
 .p-ok{background:#188038}.p-wrong{background:#b3261e}.p-mid{background:#b06000}.p-gen{background:#8a5a00}.p-none{background:#9ca3af}
 .note{font-size:12.5px;color:#374151}
 .meta{font-size:12px;color:var(--mut);margin:10px 0 0}
 .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 8px}
 .controls input,.controls select{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13px;background:var(--card)}
 details{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:10px;overflow:hidden}
 summary{cursor:pointer;padding:9px 13px;font-size:13px;font-weight:600}
 table{border-collapse:collapse;width:100%;font-size:12.5px}
 th,td{border-top:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
 th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
 code{background:#f0f0f2;padding:0 4px;border-radius:4px;font-size:11.5px}
 .num{white-space:nowrap}.wrap{word-break:break-all}
 .pillstate{display:inline-block;border-radius:4px;padding:0 6px;font-size:11px;color:#fff}
 .st-INDETERMINATE{background:#b06000}.st-UNSUPPORTED{background:#6b7280}.st-SUPPORTED{background:#188038}.st-CONTRADICTED{background:#b3261e}
 .pillmap{ok:['p-ok','CORRECT'];wrong:['p-wrong','WRONG'];mid:['p-mid',"COULDN'T CHECK"];gen:['p-gen','GENERIC'];none:['p-none','NONE']}
 .ref{float:right;font-size:12px;color:var(--mut)}

 .actgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0 4px}
 @media(max-width:820px){.actgrid{grid-template-columns:1fr}}
 ul.tiny{margin:4px 0 4px 0;padding-left:0;list-style:none;font-size:12.5px}
 ul.tiny li{margin:2px 0;color:#333}
 li.okdot::before{content:'\2713 ';color:#188038;font-weight:700}
 .tinyli{color:#666;font-size:11.5px}
</style></head><body>
<h1>Notary run review — live <span class="ref" id="stamp"></span></h1>
<p class="sub">Auto-refreshes every 20s. New runs appear on their own. Select a run; Verify / Track 2 verdicts + Plumbing.</p>
<div class="runs" id="runs"></div>
<div id="panel"><div class="card"><div class="note" id="loading">Loading…</div></div></div>
<script>
let DATA=[], cur=null, st='All', q='';
const PILL={ok:['p-ok','CORRECT'],wrong:['p-wrong','WRONG'],mid:['p-mid',"COULDN'T CHECK"],gen:['p-gen','GENERIC'],none:['p-none','NONE']};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pill=k=>{const c=(PILL[k]||PILL.none);return `<span class="pill ${c[0]}">${c[1]}</span>`};
const statePill=s=>`<span class="pillstate st-${s}">${s}</span>`;
function renderButtons(){
 const keep=cur&&DATA.some(r=>r.rid===cur);
 if(!keep) cur = DATA.length? DATA[DATA.length-1].rid : null;
 document.getElementById('runs').innerHTML=DATA.map(r=>`<button class="runbtn ${r.rid===cur?'on':''}" onclick="pick('${r.rid}')">${esc(r.name||r.rid)}<small>${esc(r.created)}${r.judge_calls?' · '+r.judge_calls+' judge':''}</small></button>`).join('');
}
function pick(rid){cur=rid;try{history.replaceState(null,'','#run='+rid)}catch(e){};renderButtons();renderPanel()}
function flowHTML(r){
 if(r.wall==null) return '<div class="flow"><div class="seg s-fin" style="width:100%"><span>no timing recorded</span></div></div>';
 const L=r.extract||0, v=r.verify_ms||0, f=r.finalize_ms||0, tot=L+v+f;
 const mk=(cls,label,sub,p)=>`<div class="seg ${cls}" style="width:${Math.max(1.5,p)}%"><b>${label}</b><span>${sub}</span></div>`;
 let parts='';
 if(L>0) parts+=mk('s-ext','1 · Extract',(L/1000).toFixed(1)+'s',L/tot*100);
 parts+=mk('s-ver','2 · Verify',(v/1000).toFixed(1)+'s · '+r.judge_calls+' calls',v/tot*100);
 if(f>30) parts+=mk('s-fin','3 · Detect/finalise',(f/1000).toFixed(1)+'s',f/tot*100);
 return `<div class="flow">${parts}</div><div class="flabel"><span><i style="background:#b06000"></i>extraction${L?' · '+(L/1000).toFixed(1)+'s':''}</span><span><i style="background:#0b57d0"></i>verify (register · fetch · judge · assign)</span><span><i style="background:#188038"></i>detect/finalise</span><span>· total ≈ ${((L+v+f)/1000).toFixed(1)}s</span></div>`;
}
function actHTML(r){
 const fet=r.evidence||[], fetched=fet.filter(e=>e.provenance==='fetched'), excerpts=fet.filter(e=>e.provenance==='caller_supplied');
 const st=r.claims||[];
 const nS=st.filter(c=>c.state==='SUPPORTED').length,nC=st.filter(c=>c.state==='CONTRADICTED').length,
       nU=st.filter(c=>c.state==='UNSUPPORTED').length,nI=st.filter(c=>c.state==='INDETERMINATE').length;
 const rej=[...new Set((r.claims||[]).flatMap(c=>c.rejectedOn||[]))];
 const did=[];
 did.push(`resolved ${fet.length} source${fet.length===1?'':'s'} (${fetched.length} fetched ${fetched.length?('· up to '+Math.max(...fetched.map(e=>e.len||0))+' chars'):''}${excerpts.length?', '+excerpts.length+' as caller excerpts':''})`);
 did.push(`${r.judge_calls} judge call${r.judge_calls===1?'':'s'} · ${(r.usage||[]).reduce((a,u)=>a+(u.in||0),0)} in / ${(r.usage||[]).reduce((a,u)=>a+(u.out||0),0)} out tokens`);
 did.push(`assigned ${nS} supported, ${nC} contradicted, ${nU} unsupported, ${nI} couldn't-check across ${st.length} claims`);
 const not=[];
 if(rej.length) not.push(`rejected rows on ${rej.join(', ')}`);
 if(nI) not.push('could not establish all fields on '+nI+' claims');
 if(!fet.length) not.push('no usable evidence at all');
 if(r.judge_calls===0) not.push('no judge needed (cache or no residue)');
 return `<div class="card"><h2>1 · Verify — activity</h2>
  <ul class="tiny">${did.map(d=>`<li class="okdot">${esc(d)}</li>`).join('')}</ul>
  ${not.length?`<div class="note"><b>Did not:</b> ${not.map(esc).join('; ')}</div>`:''}</div>`;
}
function actTrackHTML(r){
 const out=[];
 const fs=r.findings||[], gs=r.gaps||[];
 const dets={self_contradiction:0,self_report:0,source_verify:0};
 for(const f of fs) dets[f.detector]=(dets[f.detector]||0)+1;
 for(const g of gs) dets[g.detector]=(dets[g.detector]||0)+1;
 const fired=Object.keys(dets).filter(k=>dets[k]>0);
 const rows=[
  `<li>${esc(r.actEnabled?'Act enabled':'Act OFF for this org (feature flag)')}${r.act_invocations?` · ${r.act_invocations} invocation(s)`:''}</li>`
 ];
 if(fired.length) rows.push(`<li class="okdot">detectors fired: ${fired.map(f=>f+':'+dets[f]).join(', ')}</li>`);
 else if(r.actEnabled) rows.push('<li>no detector fired (nothing blatant found)</li>');
 if((r.moves||[]).length) rows.push(`<li class="okdot">moves sent to user: ${r.moves.map(m=>'<b>'+esc(m.move)+'</b>').join(', ')}</li>`);
 else if(r.actEnabled && r.act_invocations) rows.push('<li>Act ran but produced no move</li>');
 return `<div class="card"><h2>2 · Act / detectors</h2><ul class="tiny">${rows.join('')}</ul>
  ${(fs.concat(gs)).length?`<div class="note">${fs.length} finding(s) · ${gs.length} gap(s)</div>`:''}</div>`;
}
function commsHTML(r){
 const st=(r.claims||[]).map(c=>c.state);
 const lines=[`Claude sent: <b>${st.length}</b> claim(s) + <b>${(r.evidence||[]).length}</b> source(s)`];
 const urls=(r.evidence||[]).map(e=>e.url).filter(Boolean);
 if(urls.length) lines.push('<li class="tinyli">sources: '+urls.map(u=>esc(String(u).split('//')[1]||u).slice(0,42)).join(', ')+'</li>');
 let card='no issue';
 if(st.some(s=>s==='CONTRADICTED')) card='direct contradiction';
 else if(st.some(s=>s==='UNSUPPORTED')) card='no supplied evidence supports ('+st.filter(s=>s==='UNSUPPORTED').length+')';
 else if(st.some(s=>s==='INDETERMINATE')) card='could not check ('+st.filter(s=>s==='INDETERMINATE').length+')';
 lines.push(`Notary returned: <b>${card}</b>`);
 if((r.moves||[]).length) lines.push('+ '+(r.moves||[]).length+' next-move suggestion(s)');
 return `<div class="card"><h2>3 · Comms with Claude</h2><ul class="tiny">${lines.map(l=>'<li>'+l+'</li>').join('')}</ul></div>`;
}
function tripHTML(r){
 const ch=r.chain;
 let head='First trip in this thread';
 if(ch && ch.ordinal>0) head='<span style="color:#b3261e">SECOND+ trip</span> — #'+(ch.ordinal+1)+' of '+ch.len;
 const note = (ch && ch.ordinal>0) ? 'Re-invocation after a finding/ask — same sources hit the observation cache, so verify is near-free.' : (r.judge_calls===0?'No judge calls — observation cache served every field.':'');
 return `<div class="card"><h2>4 · Second trip?</h2><div class="found">${head}</div><div class="note">${esc(note)}</div><div class="meta">${esc(r.org||'')} · ${esc(r.created)} · status ${esc(r.status||'')}</div></div>`;
}
function renderPanel(){
 const r=DATA.find(x=>x.rid===cur); if(!r) return;
 document.getElementById('panel').innerHTML=`
  <div id="flow">${flowHTML(r)}</div>
  <div class="actgrid">
   ${actHTML(r)}
   ${actTrackHTML(r)}
   ${commsHTML(r)}
   ${tripHTML(r)}
  </div>
  <div class="verdict">
   <div class="card"><h2>1 · Verify</h2><div class="found">${esc(r.verify??'—')}</div>${pill(r.vpill||'none')}<div class="note">${esc(r.vnote??'')}</div>
     <div class="meta">engine: ${esc(r.engine??'?')} · ${r.judge_calls} judge calls · ${r.cost_cents}¢ · wall ${r.wall!=null?r.wall+'s':'—'}</div></div>
   <div class="card"><h2>2 · Track 2 (Move)</h2><div class="found">${esc(r.move??'—')}</div>${pill(r.mpill||'none')}<div class="note">${esc(r.mnote??'')}</div>
     ${(r.moves||[]).length?`<div class="meta">${r.moves.map(m=>'<b>'+esc(m.move)+'</b> — '+esc(m.label)).join('<br>')}</div>`:''}</div>
   <div class="card"><h2>3 · What the user saw</h2><div class="note">${esc(r.shown??'')}</div><div class="meta">created ${esc(r.created)}</div></div>
  </div>
  <div class="controls">
   <input id="q" placeholder="search claims…" oninput="q=this.value;renderTables()">
   <select id="sf" onchange="st=this.value;renderTables()"><option>All</option>${['SUPPORTED','CONTRADICTED','UNSUPPORTED','INDETERMINATE'].map(s=>`<option ${st===s?'selected':''}>${s}</option>`).join('')}</select>
   <span class="meta" id="cnt"></span>
  </div>
  <details open><summary>Plumbing — claims</summary><div id="claims"></div></details>
  <details><summary>Plumbing — evidence (what was actually checked)</summary><div id="evidence"></div></details>
  <details><summary>Plumbing — judge calls / tokens / cost</summary><div id="usage"></div></details>
  <details><summary>Plumbing — detector findings &amp; gaps</summary><div id="detect"></div></details>`;
 renderTables();
}
function renderTables(){
 const r=DATA.find(x=>x.rid===cur); if(!r) return;
 const list=(r.claims||[]).filter(c=>(st==='All'||c.state===st)&&(q===''||(c.text||'').toLowerCase().includes(q)));
 document.getElementById('cnt').textContent=list.length+' of '+(r.claims||[]).length+' claims';
 document.getElementById('claims').innerHTML=`<table><tr><th>#</th><th>Claim</th><th>Verify</th><th>Lifecycle</th></tr>${
   list.map(c=>`<tr><td class="num">${c.ordinal}</td><td class="wrap">${esc(c.text)}</td><td>${statePill(c.state)}</td><td>${esc(c.lifecycle)}${c.detail?' · '+esc(c.detail):''}</td></tr>`).join('')}</table>`;
 document.getElementById('evidence').innerHTML=`<table><tr><th>Source</th><th>provenance</th><th>chars</th><th>has excerpt</th></tr>${
   (r.evidence||[]).map(e=>`<tr><td class="wrap">${esc(e.url||'(no url)')}</td><td>${esc(e.provenance)}</td><td class="num">${e.len}</td><td>${e.has_excerpt?'yes':'no'}</td></tr>`).join('')||'<tr><td colspan=4>—</td></tr>'}</table>`;
 const ti=(r.usage||[]).reduce((a,u)=>a+(u.in||0),0),to=(r.usage||[]).reduce((a,u)=>a+(u.out||0),0);
 document.getElementById('usage').innerHTML=`<table><tr><th>type</th><th>in</th><th>out</th><th>cost</th></tr>${
   (r.usage||[]).map(u=>`<tr><td>${esc(u.type)}</td><td class="num">${u.in||0}</td><td class="num">${u.out||0}</td><td class="num">${(((u.cost_mc||0)/1000).toFixed(3))}¢</td></tr>`).join('')||'<tr><td colspan=4>—</td></tr>'}</table><div class="meta">total ${ti} in / ${to} out</div>`;
 const det=[...(r.findings||[]).map(f=>`<tr><td>finding</td><td>${esc(f.detector)}</td><td class="wrap">${esc(f.text)}</td></tr>`),...(r.gaps||[]).map(g=>`<tr><td>gap</td><td>${esc(g.detector)}</td><td class="wrap">${esc(g.unblocks)}</td></tr>`)].join('');
 document.getElementById('detect').innerHTML=`<table><tr><th>kind</th><th>detector</th><th>text</th></tr>${det||'<tr><td colspan=3>—</td></tr>'}</table>`;
}
async function refresh(){
 try{
  const res=await fetch('/api/runs',{cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  DATA=await res.json();
  const h=(location.hash.match(/run=([0-9a-f]{8})/)||[])[1];
  if(h&&DATA.some(r=>r.rid===h))cur=h;
  document.getElementById('stamp').textContent='updated '+new Date().toLocaleTimeString();
  renderButtons();renderPanel();
 }catch(e){
  document.getElementById('loading').textContent='Could not reach the runs server: '+e.message;
 }
}
refresh(); setInterval(refresh, 20000);
</script></body></html>
